name: Stockroom checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
        env:
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      STOCKROOM_TEST_DATABASE_URL: postgres://postgres:test-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.12'
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
      - run: docker compose up --build -d
      - run: python3 scripts/demo.py
      - if: always()
        run: docker compose logs && docker compose down -v
